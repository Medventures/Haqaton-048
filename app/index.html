<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnostic Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: шапка с пациентом и ролью; слева шаги маршрута МРТ с контрастом, справа
   рабочая панель шага; у координатора таблица пациентов и метрики. Спокойная
   «рентгенологическая» бирюза, семантика: готов / проверка / стоп. */
:root {
  --ground: #F2F5F6; --surface: #FFFFFF; --sunk: #E8EEF0; --ink: #122029; --soft: #3B4B55;
  --muted: #5F707A; --line: #D6DFE3; --accent: #0B6770; --accent-wash: #E0EFF0; --on-accent: #FFFFFF;
  --ok: #1D7447; --ok-wash: #E3F2E8; --warn: #9A6400; --warn-wash: #FBF0DA;
  --stop: #B02A21; --stop-wash: #FBE6E4;
  --body: "Golos Text", "Segoe UI", Arial, sans-serif; --mono: "IBM Plex Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --ground: #0E1518; --surface: #152025; --sunk: #1B2A30; --ink: #E4ECEF; --soft: #C2D0D6;
  --muted: #93A4AC; --line: #283A41; --accent: #5CC3C9; --accent-wash: #173A3D; --on-accent: #07282B;
  --ok: #6DD39A; --ok-wash: #173427; --warn: #E6B45A; --warn-wash: #3A2D14;
  --stop: #F08A80; --stop-wash: #3E1D1A; color-scheme: dark } }
:root[data-theme="dark"] {
  --ground: #0E1518; --surface: #152025; --sunk: #1B2A30; --ink: #E4ECEF; --soft: #C2D0D6;
  --muted: #93A4AC; --line: #283A41; --accent: #5CC3C9; --accent-wash: #173A3D; --on-accent: #07282B;
  --ok: #6DD39A; --ok-wash: #173427; --warn: #E6B45A; --warn-wash: #3A2D14;
  --stop: #F08A80; --stop-wash: #3E1D1A; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--ground); color: var(--ink); font: 15px/1.55 var(--body); margin: 0 }
button, input, select, textarea { font: inherit; color: inherit }
.shell { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 48px; display: grid; gap: 18px }
header.top { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: center; justify-content: space-between }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0 }
.brand-logo { display: block; width: auto; height: 40px; flex: 0 0 auto }
.brand-copy { display: grid; gap: 2px; min-width: 0 }
.brand b { font-size: 20px; letter-spacing: -.01em }
.brand span { font: 12px/1.3 var(--mono); color: var(--muted); letter-spacing: .04em; text-transform: uppercase }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center }
.seg { display: inline-flex; background: var(--sunk); border-radius: 10px; padding: 3px }
.seg button { border: 0; background: transparent; padding: 7px 12px; border-radius: 8px; cursor: pointer; color: var(--soft) }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08) }
select { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px }
.route { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px }
#route[hidden] { display: none }
.route .who { font-weight: 600 }
.route .meta { color: var(--muted); font-size: 14px }
.pill { display: inline-flex; align-items: center; gap: 6px; font: 500 12.5px/1 var(--mono); padding: 6px 9px; border-radius: 999px; white-space: nowrap }
.pill.pending { color: var(--accent); background: var(--accent-wash) }
.pill.ok { color: var(--ok); background: var(--ok-wash) } .pill.warn { color: var(--warn); background: var(--warn-wash) }
.pill.stop { color: var(--stop); background: var(--stop-wash) } .pill.info { color: var(--accent); background: var(--accent-wash) }
.synth { font: 11.5px var(--mono); color: var(--muted) }

.main { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 18px; align-items: start }
#patient-view[hidden], #coord-view[hidden] { display: none }
nav.steps { display: grid; gap: 6px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px) }
nav.steps button { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: center; text-align: left;
  border: 1px solid transparent; background: transparent; border-radius: 10px; padding: 9px 10px; cursor: pointer; color: var(--soft) }
nav.steps button .n { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font: 500 12px var(--mono); background: var(--sunk) }
nav.steps button[aria-current="step"] { background: var(--surface); border-color: var(--line); color: var(--ink) }
nav.steps button[aria-current="step"] .n { background: var(--accent); color: var(--on-accent) }
nav.steps button.done .n { background: var(--ok-wash); color: var(--ok) }
nav.steps small { display: block; color: var(--muted); font-size: 12px }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: grid; gap: 16px; min-width: 0 }
.panel h2 { margin: 0; font-size: 21px; letter-spacing: -.01em; text-wrap: balance }
.panel h3 { margin: 0; font-size: 16px }
.lead { color: var(--soft); margin: 0; max-width: 70ch }
.q { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line) }
.q:first-child { border-top: 0 }
.q .hint { color: var(--muted); font-size: 13px }
.yn { display: inline-flex; gap: 4px }
.yn button { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 12px; cursor: pointer; min-width: 52px }
.yn button[aria-pressed="true"] { background: var(--accent-wash); border-color: var(--accent); color: var(--ink) }
@media (hover: hover) { .yn button:hover { border-color: var(--accent) } }
.verdict { border-radius: 12px; padding: 14px 16px; display: grid; gap: 6px }
.verdict.pending { background: var(--sunk) }
.verdict.ok { background: var(--ok-wash) } .verdict.warn { background: var(--warn-wash) } .verdict.stop { background: var(--stop-wash) }
.verdict b { font-size: 16px }
.verdict ul { margin: 0; padding-left: 18px }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px }
label.f { display: grid; gap: 4px; font-size: 13.5px; color: var(--soft) }
label.f input, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100% }
textarea { min-height: 150px; resize: vertical; line-height: 1.5 }
.btn { border: 0; background: var(--accent); color: var(--on-accent); border-radius: 9px; padding: 9px 14px; cursor: pointer; font-weight: 500 }
.btn.ghost { background: var(--sunk); color: var(--ink) }
.btn:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.check { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); align-items: start }
.check:first-child { border-top: 0 }
.check input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--accent) }
.check .why { color: var(--muted); font-size: 13px }
.tl { display: grid; gap: 10px }
.rem { display: grid; grid-template-columns: 116px minmax(0, 1fr); gap: 14px; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px }
.rem .when { font: 13px/1.4 var(--mono); color: var(--muted) }
.rem .when b { display: block; font: 600 15px var(--body); color: var(--ink) }
.bubble { background: var(--sunk); border-radius: 12px 12px 12px 4px; padding: 10px 12px; white-space: pre-line }
.sent { display: grid; gap: 6px; padding: 10px 0; border-top: 1px solid var(--line) }
.sent:first-child { border-top: 0 }
.sent .orig { font-family: var(--mono); font-size: 13px; color: var(--soft) }
.term { border-left: 3px solid var(--accent); padding-left: 10px; font-size: 14px }
.term b { color: var(--accent) }
.alarm { border-radius: 12px; padding: 14px 16px; display: grid; gap: 8px }
.alarm.urgent { background: var(--stop-wash); border: 1px solid var(--stop) }
.alarm.soon { background: var(--warn-wash); border: 1px solid var(--warn) }
.alarm.routine { background: var(--accent-wash) }
.disclaimer { font-size: 13px; color: var(--muted); border-left: 3px solid var(--line); padding-left: 10px }
.slots { display: flex; flex-wrap: wrap; gap: 8px }
.slots button { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 8px 10px; cursor: pointer; font: 13px var(--mono) }
.slots button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-wash) }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 4px }
.kpi b { font-size: 26px; font-variant-numeric: tabular-nums }
.kpi small { color: var(--muted); font-size: 12.5px }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface) }
#coord-view { min-width: 0 }
table { border-collapse: collapse; width: 100%; min-width: 760px; font-size: 14px }
th, td { text-align: left; padding: 10px 12px; border-top: 1px solid var(--line); vertical-align: top }
th { background: var(--sunk); font: 500 12px var(--mono); text-transform: uppercase; letter-spacing: .04em; color: var(--muted); border-top: 0 }
tr.attention-warn td:first-child { box-shadow: inset 3px 0 var(--warn) }
tr.attention-stop td:first-child { box-shadow: inset 3px 0 var(--stop) }
td.num { font-variant-numeric: tabular-nums }
.faq { display: flex; flex-wrap: wrap; gap: 6px }
.faq button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 11px; cursor: pointer; font-size: 13.5px }
.foot { color: var(--muted); font-size: 12.5px; display: grid; gap: 4px }
@media (max-width: 860px) {
  .main { grid-template-columns: 1fr }
  nav.steps { position: static; display: flex; overflow-x: auto; gap: 6px; padding-bottom: 4px }
  nav.steps button { grid-template-columns: 22px auto; white-space: nowrap }
  nav.steps small { display: none }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)) }
  .grid2 { grid-template-columns: 1fr }
  .rem { grid-template-columns: 1fr; gap: 6px }
}
@media (max-width: 480px) {
  .brand { gap: 8px }
  .brand-logo { height: 36px }
  .brand b { font-size: 18px }
  .yn button { min-height: 44px }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important } }
</style>

<div class="shell">
  <header class="top">
    <div class="brand">
      <img class="brand-logo" src="assets/logo.png" alt="" width="1254" height="1254">
      <div class="brand-copy"><b>Diagnostic Companion</b><span>МРТ · КТ · колоноскопия · маммография</span></div>
    </div>
    <div class="controls">
      <div class="seg" role="group" aria-label="Роль">
        <button type="button" id="role-patient" aria-pressed="true">Пациент</button>
        <button type="button" id="role-coord" aria-pressed="false">Координатор клиники</button>
      </div>
      <label for="patient-select" class="synth">Пациент</label>
      <select id="patient-select"></select>
      <button type="button" class="btn ghost" id="reset">Сбросить демо</button>
    </div>
  </header>

  <div class="route" id="route"></div>

  <div id="patient-view" class="main">
    <nav class="steps" id="steps" aria-label="Шаги маршрута"></nav>
    <section class="panel" id="panel" aria-live="polite"></section>
  </div>

  <div id="coord-view" hidden></div>

  <div class="foot">
    <div>Все пациенты и заключения синтетические. Клинические правила демонстрационные: их утверждает клиника.</div>
    <div>Открытый код (MIT), без внешних служб: данные остаются в браузере или на сервере клиники.</div>
  </div>
</div>

<script src="routes.js?v=3" charset="utf-8"></script>
<script>
(function () {
"use strict";
var ROUTES = window.DC_ROUTES, C = window.DC_CLINIC;

function daysFromNow(d, h, m) { var x = new Date(); x.setDate(x.getDate() + d); x.setHours(h, m || 0, 0, 0); return x.toISOString(); }
function daysAgo(d) { var x = new Date(); x.setDate(x.getDate() - d); return x.toISOString().slice(0, 10); }

// Синтетические пациенты: по одному сценарию на каждый маршрут, плюс остановка.
var PATIENTS = [
  { id: "p1", name: "Айгерим С.", age: 34, route: "mri", when: daysFromNow(3, 10, 0), preset: {}, lab: null, report: "normal" },
  { id: "p2", name: "Серик Б.", age: 67, route: "ct", when: daysFromNow(4, 11, 30), preset: { diabetes: true, metformin: true, htn: true }, lab: { date: daysAgo(70), egfr: 58 }, report: "benign" },
  { id: "p3", name: "Нурлан К.", age: 45, route: "mri", when: daysFromNow(2, 15, 0), preset: { pacer: true }, lab: null, report: "alarm" },
  { id: "p4", name: "Галина П.", age: 58, route: "colon", when: daysFromNow(5, 9, 0), preset: { anticoag: true, iron: true, no_escort: true }, lab: null, report: "alarm" },
  { id: "p5", name: "Динара М.", age: 46, route: "mammo", when: daysFromNow(3, 12, 0), preset: { cycle: true }, lab: null, report: "alarm" }
];
var NEGATION = /(не выявлен|не определя|не обнаружен|нет признаков|без признаков|не смещены|без ограничения|без накопления)/i;

// ── Состояние ───────────────────────────────────────────────────────────────
var KEY = "dc-demo-v2";
function fresh() {
  var s = { role: "patient", pid: "p1", step: 0, byP: {} };
  PATIENTS.forEach(function (p) {
    var answers = {};
    if (Object.keys(p.preset).length) {
      ROUTES[p.route].questions.forEach(function (q) { answers[q.id] = false; });
      Object.assign(answers, p.preset);
    }
    s.byP[p.id] = { answers: answers, lab: p.lab ? Object.assign({}, p.lab) : { date: "", egfr: "" },
      prep: {}, reminders: {}, questions: 0, report: ROUTES[p.route].reports[p.report], explained: false, booking: null, rescheduled: false };
  });
  return s;
}
var S;
try { S = JSON.parse(localStorage.getItem(KEY)) || fresh(); } catch (e) { S = fresh(); }
if (!S.byP || !S.byP.p5) S = fresh();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

function pat(pid) { return PATIENTS.filter(function (p) { return p.id === (pid || S.pid); })[0]; }
function D(pid) { return S.byP[pid || S.pid]; }
function R(pid) { return ROUTES[pat(pid).route]; }

function el(tag, attrs, kids) {
  var e = document.createElement(tag);
  if (attrs) Object.keys(attrs).forEach(function (k) {
    if (k === "text") e.textContent = attrs[k];
    else if (k === "cls") e.className = attrs[k];
    else if (k.slice(0, 2) === "on") e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  });
  (kids || []).forEach(function (c) { if (c != null) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
  return e;
}
function fmt(iso) {
  var d = new Date(iso);
  return d.toLocaleDateString("ru-RU", { day: "numeric", month: "long", weekday: "short" }) + ", " +
    d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
}

// ── Допуск ──────────────────────────────────────────────────────────────────
function labState(pid) {
  var p = pat(pid), d = D(pid), r = R(pid);
  if (!r.lab) return { need: false };
  var need = p.age >= r.lab.ageFrom || r.questions.some(function (q) { return q.out === "lab" && d.answers[q.id]; });
  if (!need) return { need: false };
  var L = d.lab || {};
  if (!L.date || L.egfr === "" || L.egfr == null) return { need: true, ok: false, msg: "Нужен анализ: " + r.lab.name + "." };
  var age = Math.floor((Date.now() - new Date(L.date).getTime()) / 86400000);
  if (age > C.labMaxDays) return { need: true, ok: false, msg: "Анализ старше " + C.labMaxDays + " дней (" + age + " дн.): нужно пересдать." };
  if (Number(L.egfr) < C.egfrStop) return { need: true, ok: false, stop: true, msg: "СКФ " + L.egfr + ": ниже " + C.egfrStop + ", о контрасте решает рентгенолог." };
  return { need: true, ok: true, msg: "СКФ " + L.egfr + ", анализ от " + L.date + ": достаточно." };
}
function screeningProgress(pid) {
  var d = D(pid), questions = R(pid).questions;
  var answered = questions.filter(function (q) { return d.answers[q.id] === true || d.answers[q.id] === false; }).length;
  return { answered: answered, total: questions.length, complete: answered === questions.length };
}
function verdict(pid) {
  var d = D(pid), r = R(pid), progress = screeningProgress(pid), stop = [], check = [], info = [];
  if (!progress.complete) return { level: "pending", title: "Заполните анкету", stop: stop, check: check, info: info,
    lab: { need: false }, progress: progress };
  r.questions.forEach(function (q) {
    if (!d.answers[q.id]) return;
    var line = q.text + ". " + q.why;
    if (q.out === "stop") stop.push(line); else if (q.out === "check") check.push(line); else if (q.out === "info") info.push(line);
  });
  var L = labState(pid);
  if (L.need && L.stop) stop.push(L.msg); else if (L.need && !L.ok) check.push(L.msg);
  var level = stop.length ? "stop" : (check.length ? "warn" : "ok");
  return { level: level, title: { stop: "Требуется решение врача", warn: "Нужна проверка", ok: "Готов" }[level],
           stop: stop, check: check, info: info, lab: L, progress: progress };
}
function prepItems(pid) { return R(pid).prep(D(pid).answers, labState(pid).need); }
function reminders(pid) {
  var p = pat(pid), r = R(pid), t = new Date(p.when).getTime(), need = labState(pid).need;
  return r.reminders.filter(function (x) { return !x.ifLab || need; }).map(function (x) {
    return { id: x.id, label: x.label, confirm: !!x.confirm, when: new Date(t - x.h * 3600000).toISOString(),
      text: x.text.replace("{exam}", r.name).replace("{when}", fmt(p.when)).replace("{address}", C.address) };
  });
}

// ── Объяснение заключения ───────────────────────────────────────────────────
function explain(pid, text) {
  var r = R(pid);
  var sentences = text.split(/(?<=[.!?])\s+/).map(function (s) { return s.trim(); }).filter(Boolean);
  var out = [], alarms = [], prepPoor = /неудовлетворительн/i.test(text);
  var bbps = text.match(/бостонская шкала\s*(\d)/i);
  if (bbps && Number(bbps[1]) < 6) prepPoor = true;
  sentences.forEach(function (s) {
    var low = s.toLowerCase(), terms = [], used = {};
    r.glossary.forEach(function (g) {
      var at = low.indexOf(g[0]);
      if (at < 0 || used[g[1]]) return;
      // Подпись целым словом из текста: «изъязвлением», а не основа «изъязвлени».
      var end = at + g[0].length;
      while (end < s.length && /[A-Za-zА-Яа-яЁё0-9-]/.test(s.charAt(end))) end++;
      terms.push([s.slice(at, end), g[1]]); used[g[1]] = true;
    });
    r.alarms.forEach(function (a) {
      var m = s.match(a.re);
      if (!m) return;
      // Отрицание смотрим в той части предложения, где стоит слово:
      // «без конкрементов», «конкрементов не выявлено», «без ограничения диффузии».
      var start = Math.max(s.lastIndexOf(",", m.index), s.lastIndexOf(";", m.index)) + 1;
      var endC = s.slice(m.index).search(/[,;]/);
      var clause = s.slice(start, endC < 0 ? s.length : m.index + endC);
      if (NEGATION.test(clause) || /(^|\s)без\s/i.test(clause)) return;
      alarms.push({ level: a.level, spec: a.spec, phrase: m[0] });
    });
    out.push({ s: s, terms: terms });
  });
  if (r.birads) {
    var m = text.match(/bi-?rads\s*[:\-]?\s*([0-6])\s*([abc])?/i);
    if (m && r.birads[m[1]]) alarms.push({ level: r.birads[m[1]][0], spec: r.birads[m[1]][1], phrase: "BI-RADS " + m[1] + (m[2] ? m[2].toUpperCase() : "") });
  }
  var order = { urgent: 3, soon: 2, routine: 1 };
  alarms.sort(function (a, b) { return order[b.level] - order[a.level]; });
  return { sentences: out, top: alarms[0] || null, prepPoor: prepPoor };
}
function explained(pid) { var d = D(pid); return d.explained ? explain(pid, d.report) : null; }

// ── Экраны пациента ─────────────────────────────────────────────────────────
var STEPS = [["Проверка", "противопоказания и анализы"], ["Подготовка", "что сделать до визита"],
  ["Напоминания", "сообщения о визите"], ["Заключение", "объяснение простым языком"], ["Запись", "к специалисту при необходимости"]];

function go(i) { S.step = i; save(); render(); window.scrollTo(0, 0); }

  box.appendChild(el("span", { cls: "who", text: p.name + ", " + p.age }));
  box.appendChild(el("span", { cls: "synth", text: "синтетический пациент" }));
  box.appendChild(el("span", { cls: "meta", text: r.name + " · " + fmt(p.when) }));
  box.appendChild(el("span", { cls: "pill " + v.level, text: v.title }));
}
function stepDone(i) {
  var d = D(), p = pat();
  if (i === 0) return screeningProgress(p.id).complete;
  if (i === 1) return prepItems(p.id).every(function (it) { return d.prep[it[0]]; });
  if (i === 2) return d.reminders.t24 === "confirmed";
  if (i === 3) return d.explained;
  if (i === 4) return !!d.booking;
  return false;
}
function renderSteps() {
  var nav = document.getElementById("steps"); nav.textContent = "";
  STEPS.forEach(function (st, i) {
    var done = stepDone(i);
    var b = el("button", { type: "button", cls: done ? "done" : "", onclick: function () { go(i); } },
      [el("span", { cls: "n", text: done ? "✓" : String(i + 1) }), el("span", {}, [st[0], el("small", { text: st[1] })])]);
    if (S.step === i) b.setAttribute("aria-current", "step");
    nav.appendChild(b);
  });
}
function nextBtn(i, label) { return el("div", { cls: "row" }, [el("button", { type: "button", cls: "btn", text: label, onclick: function () { go(i); } })]); }

function stepCheck(panel) {
  var p = pat(), d = D(), r = R(), progress = screeningProgress(p.id), v = verdict(p.id);
  panel.appendChild(el("h2", { text: "Проверка противопоказаний и анализов" }));
  panel.appendChild(el("p", { cls: "lead", text: r.name + ". Ответьте «да» или «нет». Помощник не допускает к исследованию сам: сомнительные ответы уходят врачу." }));
  panel.appendChild(el("div", {}, [el("span", { cls: "pill info", text: "Отвечено: " + progress.answered + " из " + progress.total })]));

  if (!progress.complete) {
    vb.appendChild(el("div", { text: "Ответьте на все вопросы, чтобы проверить готовность к исследованию." }));
  } else {

    else vb.appendChild(el("div", { text: "Противопоказаний по анкете нет. Окончательное решение принимает врач на месте." }));
  }

  if (v.level === "stop") panel.appendChild(el("p", { cls: "disclaimer", text: "Информация передана координатору. Не отменяйте визит самостоятельно. Возможность проведения исследования определяет врач." }));
  if (v.level === "warn") panel.appendChild(el("p", { cls: "disclaimer", text: "Нужна дополнительная проверка перед исследованием. Координатор видит причину и свяжется с вами до визита. Не отменяйте визит самостоятельно." }));
  panel.appendChild(nextBtn(1, v.level === "ok" ? "Дальше: подготовка" : "Посмотреть дальнейшие шаги"));
  var box = el("div");
  r.questions.forEach(function (q) {
    var yes = d.answers[q.id] === true, no = d.answers[q.id] === false;
    box.appendChild(el("div", { cls: "q" }, [el("div", {}, [q.text, yes ? el("div", { cls: "hint", text: q.why }) : null]),
      el("div", { cls: "yn", role: "group", "aria-label": q.text }, [
        el("button", { type: "button", cls: "yes", "aria-pressed": String(yes), text: "Да", onclick: function () { d.answers[q.id] = true; save(); render(); } }),
        el("button", { type: "button", cls: "no", "aria-pressed": String(no), text: "Нет", onclick: function () { d.answers[q.id] = false; save(); render(); } })])]));
  });

    var dateIn = el("input", { type: "date", id: "lab-date", value: d.lab.date || "" });
    var egfrIn = el("input", { type: "number", id: "lab-egfr", min: "1", max: "200", value: d.lab.egfr === "" ? "" : String(d.lab.egfr), placeholder: "мл/мин/1,73 м²" });
    dateIn.addEventListener("change", function () { d.lab.date = dateIn.value; save(); render(); });

    panel.appendChild(el("div", { cls: "grid2" }, [el("label", { cls: "f", for: "lab-date" }, ["Дата анализа", dateIn]),

function faqBlock() {
  var d = D(), wrap = el("div", { cls: "tl" }), ans = el("div", { cls: "bubble", hidden: "" });
  wrap.appendChild(el("div", { cls: "faq" }, R().faq.map(function (f) {
    return el("button", { type: "button", text: f[0], onclick: function () { ans.hidden = false; ans.textContent = f[1]; d.questions += 1; save(); } });
  })));
  wrap.appendChild(ans);
  wrap.appendChild(el("div", { cls: "synth", text: "Ответы на частые вопросы сохраняются для оценки нагрузки на поддержку." }));
  return wrap;
}
function stepPrep(panel) {
  var d = D(), items = prepItems();
  panel.appendChild(el("h2", { text: "Инструкция по подготовке" }));
  panel.appendChild(el("p", { cls: "lead", text: "Список собран под ваши ответы. Отмечайте, что уже сделано: координатор видит, кто готов, и не звонит лишний раз." }));
  var box = el("div");
  items.forEach(function (it) {
    var id = "prep-" + it[0], cb = el("input", { type: "checkbox", id: id });

    box.appendChild(el("div", { cls: "check" }, [cb, el("label", { for: id }, [it[1], it[2] ? el("div", { cls: "why", text: it[2] }) : null])]));
  });
  panel.appendChild(box);
  var done = items.filter(function (it) { return d.prep[it[0]]; }).length;
  panel.appendChild(el("span", { cls: "pill " + (done === items.length ? "ok" : "info"), text: "Готово " + done + " из " + items.length }));
  panel.appendChild(el("h3", { text: "Частые вопросы" }));
  panel.appendChild(faqBlock());
  panel.appendChild(nextBtn(2, "Дальше: напоминания"));
}
function stepRemind(panel) {
  var d = D();
  panel.appendChild(el("h2", { text: "Напоминания о визите" }));
  panel.appendChild(el("p", { cls: "lead", text: "Сообщения уходят в WhatsApp или SMS (в демо показаны здесь). Подтверждение и перенос попадают координатору." }));
  var tl = el("div", { cls: "tl" });
  reminders(S.pid).forEach(function (x) {
    var st = d.reminders[x.id], body = el("div", { cls: "tl" }, [el("div", { cls: "bubble", text: x.text })]);
    if (x.confirm) {
      body.appendChild(el("div", { cls: "row" }, [
        el("button", { type: "button", cls: "btn", text: st === "confirmed" ? "Визит подтверждён" : "Подтвердить визит", onclick: function () { d.reminders.t24 = "confirmed"; save(); render(); } }),
        el("button", { type: "button", cls: "btn ghost", text: st === "moved" ? "Перенос запрошен" : "Перенести", onclick: function () { d.reminders.t24 = "moved"; d.rescheduled = true; save(); render(); } })]));
      if (st === "moved") body.appendChild(el("div", { cls: "synth", text: "Координатор предложит новое время. Перенос заранее вместо неявки: слот отдают другому пациенту." }));
    }
    tl.appendChild(el("div", { cls: "rem" }, [el("div", { cls: "when" }, [el("b", { text: x.label }), fmt(x.when)]), body]));
  });
  panel.appendChild(tl);
  panel.appendChild(nextBtn(3, "Дальше: заключение"));
}
var TITLES = { urgent: "Обратитесь к врачу сегодня", soon: "Нужна консультация специалиста в ближайшие дни", routine: "Покажите заключение врачу" };
function alarmBox(a) {
  var text = a.level === "urgent"
    ? "В заключении есть формулировка «" + a.phrase + "». Такие находки врач оценивает в тот же день. При ухудшении самочувствия звоните 103."
    : "В заключении есть формулировка «" + a.phrase + "». Помощник предлагает записаться: " + a.spec.charAt(0).toLowerCase() + a.spec.slice(1) + ".";
  return el("div", { cls: "alarm " + a.level }, [el("b", { text: TITLES[a.level] }), el("div", { text: text }),
    el("div", { cls: "row" }, [el("button", { type: "button", cls: "btn", text: "Записаться к специалисту", onclick: function () { go(4); } })])]);
}
function stepReport(panel) {
  var d = D(), r = R();
  panel.appendChild(el("h2", { text: "Заключение простым языком" }));
  panel.appendChild(el("p", { cls: "disclaimer", text: "Это объяснение терминов, а не заключение. Результат исследования интерпретирует врач, который вас лечит." }));
  panel.appendChild(el("h3", { text: "Что написал врач" }));

  panel.appendChild(el("label", { cls: "f", for: "report-text" }, ["Текст заключения (синтетический пример, можно вставить свой)", ta]));
  function sample(k, label) { return el("button", { type: "button", cls: "btn ghost", text: label, onclick: function () { d.report = r.reports[k]; d.explained = false; save(); render(); } }); }
  panel.appendChild(el("div", { cls: "row" }, [
    el("button", { type: "button", cls: "btn", text: "Объяснить", onclick: function () { d.report = ta.value; d.explained = true; save(); render(); } }),
    sample("normal", "Пример: норма"), sample("benign", "Пример: доброкачественное"), sample("alarm", "Пример: тревожное")]));
  if (!d.explained) return;
  var x = explain(S.pid, d.report);
  panel.appendChild(el("h3", { text: "Что делать дальше" }));
  if (x.top) panel.appendChild(alarmBox(x.top));
  else panel.appendChild(el("div", { cls: "verdict ok" }, [el("b", { text: "Тревожных формулировок не найдено" }), el("div", { text: "Обсудите результат с лечащим врачом на плановом приёме." })]));
  if (x.prepPoor) panel.appendChild(el("div", { cls: "verdict warn" }, [el("b", { text: "Подготовка оказалась недостаточной" }), el("div", { text: "Часть слизистой могла быть не видна. Координатор отметит это как нарушение подготовки и предложит повтор с усиленной подготовкой." })]));
  panel.appendChild(el("h3", { text: "Что это значит" }));
  var list = el("div");
  x.sentences.forEach(function (s) {
    var node = el("div", { cls: "sent" }, [el("div", { cls: "orig", text: s.s })]);
    s.terms.forEach(function (t) { node.appendChild(el("div", { cls: "term" }, [el("b", { text: t[0] + ": " }), t[1]])); });
    list.appendChild(node);

function slotList() {
  var out = [], now = new Date();
  for (var i = 1; out.length < 8; i++) {
    var d = new Date(now); d.setDate(now.getDate() + i);
    if (d.getDay() === 0 || d.getDay() === 6) continue;
    [[10, 0], [15, 30]].forEach(function (hm) { var s = new Date(d); s.setHours(hm[0], hm[1], 0, 0); out.push(s.toISOString()); });
  }
  return out;
}
function stepBook(panel) {
  var d = D(), x = explained(S.pid), a = x && x.top;
  panel.appendChild(el("h2", { text: "Запись к специалисту" }));
  if (!a) { panel.appendChild(el("p", { cls: "lead", text: "Запись предлагается, когда в заключении есть формулировка, требующая консультации. Сначала откройте шаг «Заключение»." })); return; }
  if (a.level === "urgent") {
    panel.appendChild(alarmBox(a));
    panel.appendChild(el("p", { cls: "lead", text: "Координатор клиники получил сигнал и позвонит вам сегодня. Ниже ближайшее время, если врач решит принять в плановом порядке." }));
  } else panel.appendChild(el("p", { cls: "lead", text: "Специалист: " + a.spec + ". Выберите время; заключение уйдёт врачу вместе с записью." }));
  var slots = el("div", { cls: "slots", role: "group", "aria-label": "Свободное время" });
  slotList().forEach(function (s) {
    slots.appendChild(el("button", { type: "button", "aria-pressed": String(!!d.booking && d.booking.when === s), text: fmt(s),
      onclick: function () { d.booking = { when: s, spec: a.spec, level: a.level }; save(); render(); } }));
  });
  panel.appendChild(slots);
  if (d.booking) panel.appendChild(el("div", { cls: "verdict ok" }, [el("b", { text: "Вы записаны" }), el("div", { text: d.booking.spec + ", " + fmt(d.booking.when) + ". Напоминание придёт за сутки." })]));
}

// ── Координатор ─────────────────────────────────────────────────────────────
function metrics() {
  var m = { total: PATIENTS.length, moved: 0, prepMissing: 0, prepPoor: 0, questions: 0, alarms: 0, booked: 0, blocked: 0 };
  PATIENTS.forEach(function (p) {
    var d = D(p.id), items = prepItems(p.id), x = explained(p.id);
    if (d.rescheduled) m.moved += 1;
    if (items.some(function (it) { return !d.prep[it[0]]; })) m.prepMissing += 1;
    if (x && x.prepPoor) m.prepPoor += 1;
    if (verdict(p.id).level !== "ok") m.blocked += 1;
    m.questions += d.questions;
    if (x && x.top && x.top.level !== "routine") { m.alarms += 1; if (d.booking) m.booked += 1; }
  });
  return m;
}
function kpi(v, label, hint) { return el("div", { cls: "kpi" }, [el("small", { text: label }), el("b", { text: v }), el("small", { text: hint })]); }
function renderCoord() {
  var root = document.getElementById("coord-view"); root.textContent = "";
  var m = metrics();
  root.appendChild(el("div", { cls: "kpis" }, [
    kpi(m.blocked + " из " + m.total, "Требуют внимания", "Анкета не завершена, нужна проверка или решение врача"),
    kpi((m.prepMissing + m.prepPoor) + "", "Нарушения подготовки", m.prepMissing + " не подтвердили, " + m.prepPoor + " по заключению"),
    kpi(String(m.questions), "Вопросы, обработанные помощником", "Ответы на частые вопросы без участия оператора"),
    kpi(m.alarms ? (m.booked + " из " + m.alarms) : "нет", "Конверсия в консультацию", "Записаны после тревожного заключения")
  ]));
  var head = ["Пациент", "Исследование", "Визит", "Допуск", "Причины", "Подготовка", "Визит подтверждён", "Заключение", "Запись"];
  var table = el("table", {}, [el("thead", {}, [el("tr", {}, head.map(function (h) { return el("th", { text: h }); }))])]);
  var tb = el("tbody");
  PATIENTS.forEach(function (p) {
    var d = D(p.id), v = verdict(p.id), items = prepItems(p.id), x = explained(p.id);
    var done = items.filter(function (it) { return d.prep[it[0]]; }).length;
    var rep = !x ? "не открыто" : (x.top ? { urgent: "срочно", soon: "нужна консультация", routine: "обсудить с врачом" }[x.top.level] : "без тревожных");
    if (x && x.prepPoor) rep += "; подготовка недостаточна";
    tb.appendChild(el("tr", { cls: v.level === "stop" ? "attention-stop" : v.level === "warn" ? "attention-warn" : "" }, [
      el("td", {}, [el("b", { text: p.name }), el("div", { cls: "synth", text: p.age + " лет" })]),
      el("td", { text: ROUTES[p.route].short }),
      el("td", { text: fmt(p.when) }),
      el("td", {}, [el("span", { cls: "pill " + v.level, text: v.title })]),
      el("td", { text: v.level === "pending" ? "ожидаются ответы" : (v.stop.concat(v.check).map(function (t) { return t.split(".")[0]; }).join("; ") || "нет") }),
      el("td", { cls: "num", text: done + "/" + items.length }),
      el("td", { text: d.reminders.t24 === "confirmed" ? "да" : d.reminders.t24 === "moved" ? "перенос" : "ждём" }),
      el("td", { text: rep }),
      el("td", { text: d.booking ? d.booking.spec + ", " + fmt(d.booking.when) : "нет" })]));
  });
  table.appendChild(tb);
  root.appendChild(el("div", { cls: "tablewrap" }, [table]));
  root.appendChild(el("div", { cls: "foot" }, [
    el("div", { text: "Метрики по данным демо-сессии. В клинике их считают за месяц: отмены и неявки, нарушения подготовки (не подтверждена или недостаточна по заключению), вопросы, обработанные помощником, записи на консультацию после тревожного заключения." }),
    el("div", { text: "«Требуется решение врача» и «нужна проверка» не отменяют визит: координатор получает причину и связывается с пациентом и врачом." })
  ]));
  var src = el("details", { cls: "foot" }, [el("summary", { text: "Источники правил (открытые клинические рекомендации)" })]);
  src.appendChild(el("ul", {}, window.DC_SOURCES.map(function (s) { return el("li", { text: s }); })));
  root.appendChild(src);
}

// ── Сборка ──────────────────────────────────────────────────────────────────
function render() {
  var sel = document.getElementById("patient-select");
  if (!sel.options.length) PATIENTS.forEach(function (p) { sel.appendChild(el("option", { value: p.id, text: p.name + " · " + ROUTES[p.route].short })); });
  sel.value = S.pid;
  var coord = S.role === "coord";
  document.getElementById("role-patient").setAttribute("aria-pressed", String(!coord));
  document.getElementById("role-coord").setAttribute("aria-pressed", String(coord));
  document.getElementById("patient-view").hidden = coord;
  document.getElementById("coord-view").hidden = !coord;
  document.getElementById("route").hidden = coord;
  document.querySelector('label[for="patient-select"]').hidden = coord;
  sel.hidden = coord;
  if (coord) { renderCoord(); return; }
  renderRoute(); renderSteps();
  var panel = document.getElementById("panel"); panel.textContent = "";
  [stepCheck, stepPrep, stepRemind, stepReport, stepBook][S.step](panel);
}
document.getElementById("patient-select").addEventListener("change", function (e) { S.pid = e.target.value; S.step = 0; save(); render(); });
document.getElementById("role-patient").addEventListener("click", function () { S.role = "patient"; save(); render(); });
document.getElementById("role-coord").addEventListener("click", function () { S.role = "coord"; save(); render(); });
document.getElementById("reset").addEventListener("click", function () { S = fresh(); save(); render(); });

window.DC = { verdict: verdict, explain: explain, prepItems: prepItems, reminders: reminders, labState: labState, screeningProgress: screeningProgress, PATIENTS: PATIENTS };
render();
})();
